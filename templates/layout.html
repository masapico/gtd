<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTD - Personal Task & Info Manager</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js?v=3"></script>
</head>
<body hx-ext="morph">

  <!-- Top App Bar & Quick Capture -->
  <header class="app-topbar">
    <div class="topbar-left">
      <button class="menu-toggle-btn" onclick="toggleSidebar()" title="メニュー切り替え" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>

      <div class="brand-section">
        <span class="brand-monogram" aria-hidden="true">GTD</span>
        <span class="brand-name">Getting Things Done</span>
      </div>
    </div>

    <!-- Quick Capture Form (Centered) -->
    <form class="quick-capture-form" hx-post="/items" hx-swap="none" onsubmit="setTimeout(() => { document.getElementById('quick-capture-input').value = ''; }, 30);">
      <div class="quick-capture-wrapper">
        <svg class="quick-capture-icon" viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        <input 
          id="quick-capture-input" 
          name="title" 
          class="quick-capture-input" 
          type="text" 
          placeholder="タスク名 #タグ ^期日 (例: 資料作成 #30分 ^today|^金)" 
          title="スマート記法対応: #タグ名 でContext付与、^today / ^tomorrow / ^金 / ^日付 で期日指定"
          autocomplete="off" 
          required
        >
        <span class="shortcut-badge" title="ショートカットキー">Alt+N</span>
      </div>
    </form>

    <div class="topbar-right"></div>
  </header>

  <!-- 3-Pane Body -->
  <div class="app-body">
    <!-- Left Pane: Navigation & Filters -->
    <nav id="sidebar-pane" class="sidebar-pane" hx-get="/partials/sidebar" hx-trigger="itemChanged from:body, projectChanged from:body, contextChanged from:body" hx-swap="innerHTML">
      {{template "sidebar.html" .Sidebar}}
    </nav>

    <!-- Center Pane: Main Content List or Review Wizard -->
    <main id="main-content-pane" class="main-content-pane" hx-get="/partials/items?view={{.ItemList.View}}{{if .ItemList.CurrentProject}}&project_id={{.ItemList.CurrentProject.ID}}{{end}}{{if .ItemList.CurrentContext}}&context_id={{.ItemList.CurrentContext.ID}}{{end}}" hx-trigger="itemChanged from:body, listRefresh from:body, contextChanged from:body, projectChanged from:body" hx-swap="innerHTML">
      {{template "item_list.html" .ItemList}}
    </main>

    <!-- Right Pane: Side Sheet / Detail Inspector -->
    <aside id="item-detail-pane" class="item-detail-pane closed">
      <!-- Item detail dynamically loaded here via htmx -->
    </aside>
  </div>

</body>
</html>
