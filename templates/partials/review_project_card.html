<div class="review-card {{if .IsStalled}}stalled{{end}}" id="project-review-card-{{.ID}}">
  {{if .IsStalled}}
    <div class="stalled-badge">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="vertical-align: text-bottom; margin-right: 3px;">
        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
      </svg>
      <span>止まっているプロジェクト (Next Actionが0件)</span>
    </div>
  {{end}}

  <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
    <div>
      <h3 style="font-size: 1.1rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="color: var(--md-sys-color-primary);">
          <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
        </svg>
        <span>{{.Name}}</span>
      </h3>
      {{if .Description}}
        <p style="font-size: 0.85rem; color: var(--md-sys-color-on-surface-variant); margin-top: 2px;">{{.Description}}</p>
      {{end}}
      <div style="font-size: 0.78rem; color: var(--md-sys-color-outline); margin-top: 4px;">
        Next Action: <strong>{{.NextActionCount}}</strong> 件 / 合計: {{.TotalItemCount}} 件
        {{if .LastReviewedAt}} | 前回点検: {{formatDate .LastReviewedAt}}{{end}}
      </div>
    </div>

    <div style="display: flex; gap: 6px; flex-shrink: 0;">
      <button class="btn-small {{if .IsReviewedRecently}}btn-reviewed{{end}}" 
              hx-post="/review/projects/{{.ID}}/reviewed" 
              hx-target="#project-review-card-{{.ID}}" 
              hx-swap="outerHTML" 
              title="{{if .IsReviewedRecently}}点検済み（クリックで再点検）{{else}}点検完了として日時を更新{{end}}">
        {{if .IsReviewedRecently}}✓ 点検済{{else}}点検完了{{end}}
      </button>
      <button class="btn-small" 
              hx-patch="/projects/{{.ID}}/status" hx-vals='{"status": "someday"}' 
              hx-target="#project-review-card-{{.ID}}" hx-swap="delete">
        Somedayへ
      </button>
      <button class="btn-small" 
              hx-patch="/projects/{{.ID}}/status" hx-vals='{"status": "done"}' 
              hx-target="#project-review-card-{{.ID}}" hx-swap="delete">
        プロジェクト完了
      </button>
    </div>
  </div>

  <!-- Inline Add Next Action Form -->
  <form style="display: flex; gap: 6px; margin-top: 12px;" 
        hx-post="/review/projects/{{.ID}}/items" 
        hx-target="#project-review-card-{{.ID}}" 
        hx-swap="outerHTML">
    <input type="hidden" name="project_id" value="{{.ID}}">
    <input type="hidden" name="status" value="next">
    <input class="form-input" style="padding: 6px 10px; font-size: 0.85rem;" name="title" placeholder="+ このプロジェクトのNext Actionを追加して前進させる..." required autocomplete="off">
    <button class="btn-small" type="submit" style="white-space: nowrap; font-weight: 600;">追加</button>
  </form>
</div>
