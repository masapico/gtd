<div id="item-detail-content" data-item-id="{{.Item.ID}}" 
     hx-get="/items/{{.Item.ID}}/detail" 
     hx-trigger="itemDetailRefresh from:body, contextChanged from:body" 
     hx-target="#item-detail-pane" 
     hx-swap="innerHTML">
  <!-- Detail Header -->
  <div class="detail-header">
    <div style="font-size: 0.85rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant);">
      アイテム詳細
    </div>
    <div class="detail-header-actions">
      <!-- Delete Button -->
      <button class="icon-btn danger" 
              hx-delete="/items/{{.Item.ID}}" 
              hx-confirm="このアイテムを完全に削除しますか？" 
              hx-swap="none" 
              onclick="closeDetailPane()" 
              title="削除">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
        </svg>
      </button>

      <!-- Close Button -->
      <button class="icon-btn" onclick="closeDetailPane()" title="閉じる (Esc)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="detail-body">
    <!-- Status Selector -->
    <div class="form-group">
      <label class="form-label">Status</label>
      <div class="status-selector">
        <button type="button" class="status-btn {{if eq .Item.Status "inbox"}}active{{end}}" 
                hx-patch="/items/{{.Item.ID}}/status" hx-vals='{"status": "inbox"}'
                hx-target="#item-detail-pane" hx-swap="innerHTML">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M19 3H4.99c-1.11 0-1.98.89-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"/>
    </svg>
          Inbox
        </button>
        <button type="button" class="status-btn {{if eq .Item.Status "next"}}active{{end}}" 
                hx-patch="/items/{{.Item.ID}}/status" hx-vals='{"status": "next"}'
                hx-target="#item-detail-pane" hx-swap="innerHTML">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
    </svg>
          Next
        </button>
        <button type="button" class="status-btn {{if eq .Item.Status "waiting"}}active{{end}}" 
                hx-patch="/items/{{.Item.ID}}/status" hx-vals='{"status": "waiting"}'
                hx-target="#item-detail-pane" hx-swap="innerHTML">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
    </svg>
          Waiting
        </button>
        <button type="button" class="status-btn {{if eq .Item.Status "someday"}}active{{end}}" 
                hx-patch="/items/{{.Item.ID}}/status" hx-vals='{"status": "someday"}'
                hx-target="#item-detail-pane" hx-swap="innerHTML">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V18z"/>
    </svg>
          Someday
        </button>
        <button type="button" class="status-btn {{if eq .Item.Status "reference"}}active{{end}}" 
                hx-patch="/items/{{.Item.ID}}/status" hx-vals='{"status": "reference"}'
                hx-target="#item-detail-pane" hx-swap="innerHTML">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
    </svg>
          Reference
        </button>
        <button type="button" class="status-btn {{if eq .Item.Status "done"}}active{{end}}" 
                hx-patch="/items/{{.Item.ID}}/status" hx-vals='{"status": "done"}'
                hx-target="#item-detail-pane" hx-swap="innerHTML">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
    </svg>
          Done
        </button>
      </div>
    </div>

    <!-- Auto-saving Item Detail Form -->
    <form hx-put="/items/{{.Item.ID}}" hx-trigger="change, input delay:500ms" hx-swap="none">
      <input type="hidden" name="status" value="{{.Item.Status}}">

      <!-- Title -->
      <div class="form-group">
        <label class="form-label" for="detail-title">タイトル</label>
        <input id="detail-title" name="title" class="form-input" type="text" value="{{.Item.Title}}" placeholder="タイトル... (#タグ ^期日 も利用可能)" required autocomplete="off">
      </div>

      <!-- Project -->
      <div class="form-group">
        <label class="form-label" for="detail-project">プロジェクト</label>
        <select id="detail-project" name="project_id" class="form-select">
          <option value="">（プロジェクト未設定）</option>
          {{range .AllProjects}}
            <option value="{{.ID}}" {{if $.Item.ProjectID}}{{if eq (derefInt64 $.Item.ProjectID) .ID}}selected{{end}}{{end}}>
              {{.Name}}
            </option>
          {{end}}
        </select>
      </div>

      <!-- Due Date & Recurrence -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="detail-due">期日</label>
          <input id="detail-due" name="due_date" class="form-input" type="date" value="{{formatShortDate .Item.DueDate}}">
        </div>
        <div class="form-group">
          <label class="form-label" for="detail-recurrence">繰り返し（業務リピート）</label>
          <select id="detail-recurrence" name="recurrence" class="form-select">
            <option value="none" {{if eq .Item.Recurrence "none"}}selected{{end}}>なし</option>
            <option value="daily" {{if eq .Item.Recurrence "daily"}}selected{{end}}>毎日</option>
            <option value="weekdays" {{if eq .Item.Recurrence "weekdays"}}selected{{end}}>平日 (月〜金)</option>
            <option value="weekly" {{if eq .Item.Recurrence "weekly"}}selected{{end}}>毎週</option>
            <option value="monthly" {{if eq .Item.Recurrence "monthly"}}selected{{end}}>毎月</option>
            <option value="yearly" {{if eq .Item.Recurrence "yearly"}}selected{{end}}>毎年</option>
          </select>
        </div>
      </div>

      <!-- Body / Note -->
      <div class="form-group">
        <label class="form-label" for="detail-body">詳細メモ・手順</label>
        <textarea id="detail-body" name="body" class="form-textarea" placeholder="業務手順、関連リンク、打ち合わせメモなど...">{{.Item.Body}}</textarea>
      </div>
    </form>

    <!-- Context Tags Selector -->
    <div class="form-group">
      <label class="form-label">Context タグ</label>
      <div class="context-tags-wrapper">
        {{range .AllContexts}}
          <button type="button" 
                  class="context-tag-btn {{if $.Item.HasContext .ID}}active{{end}}" 
                  hx-post="/items/{{$.Item.ID}}/contexts/{{.ID}}/toggle" 
                  hx-target="#item-detail-pane"
                  title="クリックでタグ付け切り替え">
            {{.Name}}
          </button>
        {{end}}
      </div>
    </div>

    <!-- Attachments Container -->
    <div id="attachments-container" class="attachments-section">
      {{template "attachments.html" dict "ItemID" .Item.ID "Attachments" .Item.Attachments}}
    </div>
  </div>
</div>
