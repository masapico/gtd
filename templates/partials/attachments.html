<div class="form-group">
  <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
    <span style="display:flex; align-items:center; gap:6px;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
        <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
      </svg>
      <span>添付・関連リンク・スクショ ({{len .Attachments}})</span>
    </span>
  </label>

  <!-- Attachments List -->
  <div style="margin-top: 6px;">
    {{range .Attachments}}
      {{template "attachment_item.html" dict "Attachment" . "IsEditing" false}}
    {{end}}
  </div>

  <!-- Add Attachment Form -->
  <form style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px;" 
        hx-post="/items/{{.ItemID}}/attachments" 
        hx-target="#attachments-container" 
        hx-swap="innerHTML"
        onsubmit="setTimeout(() => { this.reset(); }, 30)">
    <div style="display:flex; gap:6px;">
      <input class="form-input" style="padding: 5px 8px; font-size: 0.8rem;" name="target" placeholder="URL / ファイルパス" required autocomplete="off">
      <input class="form-input" style="padding: 5px 8px; font-size: 0.8rem; max-width: 130px;" name="label" placeholder="表示名 (任意)" autocomplete="off">
      <button class="btn-small" type="submit" style="padding: 5px 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        <span style="white-space: nowrap;">追加</span>
      </button>
    </div>
  </form>
</div>
